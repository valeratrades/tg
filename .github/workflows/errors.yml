env:
  CARGO_INCREMENTAL: "0"
  CARGO_NET_RETRY: "10"
  RUSTC_WRAPPER: ""
  RUSTUP_MAX_RETRIES: "10"
  RUST_BACKTRACE: short
jobs:
  pre_ci:
    uses: valeratrades/.github/.github/workflows/pre_ci.yml@main
  rust-tests:
    if: needs.pre_ci.outputs.continue
    name: Rust ${{matrix.rust}}
    needs: pre_ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{matrix.rust}}
      - name: Install mold
        uses: rui314/setup-mold@v1
      - if: github.ref == 'refs/heads/release'
        name: Set RUSTFLAGS for release branch
        run: echo "RUSTFLAGS=-Dwarnings" >> $GITHUB_ENV
      - if: matrix.rust == 'nightly'
        name: Enable type layout randomization
        run: |
          printf '#!/bin/sh\nexec "$@" -Zrandomize-layout --cfg=exhaustive\n' > /tmp/randomize-layout.sh
          chmod +x /tmp/randomize-layout.sh
          echo RUSTC_WORKSPACE_WRAPPER=/tmp/randomize-layout.sh >> $GITHUB_ENV
      - name: Download modified by pre-ci Cargo.toml files
        uses: actions/download-artifact@v7
        with:
          name: modified-cargo-files
      - run: cargo update
      - uses: Swatinem/rust-cache@v2
      - run: echo "T0=$(date +%s)" >> $GITHUB_ENV
      - run: cargo test --workspace --no-run
      - run: echo "T1=$(date +%s)" >> $GITHUB_ENV
      - run: cargo check --workspace --all-targets
      - run: echo "T2=$(date +%s)" >> $GITHUB_ENV
      - run: cargo test --workspace
      - run: echo "T3=$(date +%s)" >> $GITHUB_ENV
      - env:
          loc_gist_token: ${{ secrets.loc_gist_token }}
        if: github.ref_name == github.event.repository.default_branch && matrix.rust == 'nightly'
        name: Ensure loc_gist_token secret is configured
        run: |
          if [ -z "${loc_gist_token}" ]; then
            echo "::error::Secret 'loc_gist_token' is not set (empty in this job)."
            if [ "${{ github.event.repository.private }}" = "true" ]; then
              echo "::error::This repo is PRIVATE. On GitHub Free-plan orgs, organization secrets are NOT exposed to private repos — if 'loc_gist_token' is set org-wide it still won't reach here. Fix: set it repo-level (gh secret set loc_gist_token -R ${{ github.repository }}), or upgrade the org to Team/Enterprise."
            else
              echo "::error::Add it under Settings → Secrets and variables → Actions (repo-level, or org-level with 'All repositories' visibility — org secrets reach public repos on any plan)."
            fi
            echo "::error::Create a token, then: gh secret set loc_gist_token --repo <owner>/<repo> --body YOUR_TOKEN"
            echo "::error::Bulk-provision all repos: https://github.com/valeratrades/nix/tree/e4338bf5943d7403b949a8e079f9073987d9cd68/home/scripts/shared_github_secrets.bash"
            exit 1
          fi
      - env:
          GH_TOKEN: ${{ secrets.loc_gist_token }}
        if: github.ref_name == github.event.repository.default_branch && matrix.rust == 'nightly'
        name: Update badge gist
        run: |
          PNAME="${GITHUB_REPOSITORY##*/}"
          gh api -X PATCH gists/b48e6f02c61942200e7d1e3eeabf9bcb --silent \
          -f "files[$PNAME-build.json][content]={\"schemaVersion\": 1, \"label\": \"build\", \"message\": \"$(((T1-T0)/60))m $(((T1-T0)%60))s\", \"color\": \"lightblue\"}" \
          -f "files[$PNAME-test.json][content]={\"schemaVersion\": 1, \"label\": \"test\", \"message\": \"$(((T3-T2)/60))m $(((T3-T2)%60))s\", \"color\": \"lightblue\"}"
    strategy:
      fail-fast: false
      matrix:
        rust:
          - nightly
          - nightly-2026-06-29
    timeout-minutes: 45
name: Errors
on:
  push: {}
  workflow_dispatch: {}
permissions:
  contents: read
