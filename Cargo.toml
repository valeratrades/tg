[package]
name = "tg"
version = "0.9.7"
edition = "2024"
authors = ["Valeriy Sakharov <valeratrades@gmail.com>"]
description = "Telegram CLI client"
license = "BlueOak-1.0.0"
repository = "https://github.com/valeratrades/tg"

[package.metadata.cargo-machete]
ignored = ["color-eyre"]
rand = "0.8.5"

[dependencies]
# path until ask_llm's queued breaking changes ship as 4.0.0; `nix build` can't see outside the tree
ask_llm = { path = "/home/v/s/ask_llm", default-features = false }
clap = { version = "4.5.54", features = ["derive"] }
clap-stdin = "0.8"
clap_complete = "4"
color-eyre = "0.6.5"
config = "0.15.19"
derive-new = "0.7.0"
derive_more = { version = "2", features = ["display", "from_str"] }
dirs = "6.0.0"
eyre = "^0.6.12"
futures = "0.3.31"
futures-util = "^0.3.31"
grammers-client = "=0.10.0"
grammers-mtsender = "=0.10.0"
grammers-session = "=0.10.0"
grammers-tl-types = "=0.10.0"
jiff = "0.2"
miette = { version = "7", features = ["fancy"] }
mime_guess = "2"
regex = "1"
reqwest = { version = "0.13.1", features = ["rustls", "form", "json"], default-features = false }
serde = "^1.0.228"
serde_json = "^1.0.149"
tempfile = "3"
thiserror = "2.0.18"
tokio = { version = "^1.49.0", features = ["full"] }
toml = "^0.9.11"
tracing = "^0.1.44"
v_utils = { version = "^2.17.6", features = ["io", "async-io", "distributions", "macros", "cli", "xdg"] }
xattr = "1.6.1"

#[patch.crates-io]
#v_utils = { path = "/home/v/s/v_utils/v_utils" }
#v_utils_macros = { path = "/home/v/s/v_utils/v_utils_macros" }

[dev-dependencies]
insta = "1.46.1"
tempfile = "3"

[lints.rust]
unused_features = "allow"
